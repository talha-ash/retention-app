[package]
name = "retention-popup"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fsrs = "7.0.0"
iced = { version = "0.14", features = ["smol"] }
iced_layershell = "0.19"
ksni = { version = "0.3.7", default-features = false, features = ["tokio", "blocking"] }
rusqlite = { version = "0.37", features = ["bundled", "serialize"] }
zip = "2"
zstd = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31.15"

# Cargo.lock pins winit-common and winit-core to 0.31.0-beta.2.
# beta.4 adds a key code iced_layershell 0.19 cannot match, and the build breaks.

[patch.crates-io]
iced_layershell = { path = "vendor/iced_layershell" }
layershellev = { path = "vendor/layershellev" }
